name: CI Pipeline

on:
  push:
    branches: [main, master, 'improve/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Test Suites (Vitest)
        run: npm test

      - name: TypeScript Compilation & Production Build
        run: npm run build
